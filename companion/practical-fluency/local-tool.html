<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Next practice topic</title><style>body{font:18px/1.6 Arial;max-width:38rem;margin:3rem auto;padding:1rem;color:#173345;background:#faf9f4}label{display:block;margin:1rem 0}button,input{font:inherit;padding:.4rem}button{margin:.4rem}input#topic{width:100%}#status{background:#e9eef0;padding:1rem}</style><h1>Next practice topic</h1><p>Fictional practice. Data stays in this browser profile; export for a portable copy.</p><label for="topic">Practice topic</label><input id="topic" maxlength="120"><label><input id="done" type="checkbox">Practice complete</label><button id="save">Save topic</button><button id="export">Export handoff</button><button id="reset">Reset local record</button><p id="status" role="status"></p><script>const topic=document.querySelector('#topic'),done=document.querySelector('#done');function render(){const s=JSON.parse(localStorage.getItem('practice')||'{}');topic.value=s.topic||'';done.checked=!!s.done;document.querySelector('#status').textContent=s.topic?'Saved in this browser profile.':'Choose a topic to begin.'}document.querySelector('#save').onclick=()=>{const value=topic.value.trim();if(!value||value.length>120){document.querySelector('#status').textContent='Enter a topic of 1 to 120 characters.';return}localStorage.setItem('practice',JSON.stringify({topic:value,done:done.checked}));render()};done.onchange=()=>{const s=JSON.parse(localStorage.getItem('practice')||'{}');if(s.topic){s.done=done.checked;localStorage.setItem('practice',JSON.stringify(s));render()}};document.querySelector('#reset').onclick=()=>{localStorage.removeItem('practice');render()};function report(){const s=JSON.parse(localStorage.getItem('practice')||'{}');return s.topic?`Topic: ${s.topic}\nCompleted: ${!!s.done}\n`:'No saved practice topic.\n'};render();document.querySelector('#export').onclick=()=>{const b=new Blob([report()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='handoff.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
